<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">
  <title>AI Agent Orchestrator</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>AI Agent Orchestrator</h1>
    <span id="conn" class="conn" title="接続状態">●</span>
    <button id="newProjectBtn" class="btn primary">＋ 新規プロジェクト</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>承認待ち <span id="approvalCount" class="badge">0</span></h2>
        <div id="approvals" class="stack"></div>
      </section>
      <section>
        <h2>プロジェクト</h2>
        <div id="projects" class="stack"></div>
      </section>
    </aside>

    <section id="detail" class="detail">
      <p class="empty">プロジェクトを選択するか、新規作成してください。</p>
    </section>
  </main>

  <div id="login" class="overlay" hidden>
    <div class="dialog">
      <h2>ログイン</h2>
      <p>サーバー起動時に表示されたダッシュボードURL(<code>/login?token=…</code>)を開いてください。</p>
    </div>
  </div>

  <dialog id="newProject" class="dialog">
    <form id="newProjectForm" method="dialog">
      <h2>新規プロジェクト</h2>
      <label>名前<input name="name" required maxlength="100"></label>
      <label>目的・依頼内容<textarea name="goal" required rows="5" placeholder="例: 30代向けの手軽な朝食サブスクを企画し、LPを作る"></textarea></label>
      <label>予算 (USD)<input name="budgetUsd" type="number" min="0.5" step="0.5" value="10"></label>
      <fieldset>
        <legend>チーム</legend>
        <div id="teamChoices" class="choices"></div>
      </fieldset>
      <p id="newProjectError" class="error" hidden></p>
      <div class="row end">
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">作成して計画開始</button>
      </div>
    </form>
  </dialog>

  <dialog id="fileViewer" class="dialog wide">
    <div class="row between">
      <h2 id="fileTitle"></h2>
      <button type="button" class="btn" data-close>閉じる</button>
    </div>
    <pre id="fileBody" class="file"></pre>
  </dialog>
</body>
</html>
